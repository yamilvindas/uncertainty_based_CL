exp_id: Camelyon17_Mem-50_Replay
device: cuda:0
results_dir: ./results
ContinualLearning:
  Replay:
    use_replay: true
    memory_strategy: uncertainty
    capacity: 0.5
    lambda_replay: 1.0
    we: 1.0
    wH: 1.0
    wa: 1.0
    alea_drop_fraction: 0.15
    mc_passes: 20
    by_class: true
    optimize_uniform_ratio: false
    uniform_ratio: 0.5
  EWC:
    use_ewc: false
    lambda_ewc: 0.0
Dataset:
  dataset_type: Camelyon17
  Lite: true
  num_classes: 2
Model:
  model_type: CamelyonMobileNet
Training:
  epochs: 20
  lr: 0.001
  weight_decay: 1.0e-05
  batch_size: 64
  n_repetitions: 10
Optuna:
  use_optuna: true
  n_trials: 30
