exp_id: OrganMNIST_NoMemory
device: cuda:0
results_dir: ./results
ContinualLearning:
  Replay:
    use_replay: false
    memory_strategy: Uniform
    capacity: 0.0
    lambda_replay: 0.0
  EWC:
    use_ewc: false
    lambda_ewc: 0.0
Dataset:
  dataset_type: OrganMNIST
  Lite: true
  num_classes: 11
Model:
  model_type: OrganCNN
Training:
  epochs: 20
  lr: 0.001
  weight_decay: 1.0e-05
  batch_size: 64
  n_repetitions: 10
Optuna:
  use_optuna: true
  n_trials: 30
