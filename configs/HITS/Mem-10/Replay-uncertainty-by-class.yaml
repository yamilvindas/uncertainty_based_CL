exp_id: HITS_Mem-10_Replay
device: cuda:0
results_dir: ./results
ContinualLearning:
  Replay:
    use_replay: true
    memory_strategy: uncertainty
    capacity: 0.1
    lambda_replay: 1.0
    we: 1.0
    wH: 1.0
    wa: 1.0
    alea_drop_fraction: 0.15
    mc_passes: 20
    by_class: true
    optimize_uniform_ratio: false
    uniform_ratio: 0.5
  EWC:
    use_ewc: false
    lambda_ewc: 0.0
Dataset:
  dataset_type: HITS
  num_classes: 3
  task_a_hdf5: ''
  task_b_hdf5: ''
Model:
  model_type: TimeFreq2DCNN
Training:
  epochs: 50
  lr: 0.001
  weight_decay: 1.0e-07
  batch_size: 32
  n_repetitions: 10
Optuna:
  use_optuna: true
  n_trials: 75
